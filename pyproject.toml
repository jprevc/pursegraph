[project]
name = "pursegraph"
version = "0.1.0"
description = "A self-hosted family finance overview"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-axes>=8.3.1",
    "gunicorn>=26.2.0",
    "mypy>=1.11",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.17.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pursegraph.settings_test"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "DJ", "SIM"]
ignore = ["E501"]  # line length is the formatter's job

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
# Most code isn't annotated; still type-check the bodies of unannotated functions.
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
# django-axes ships no type information.
module = ["axes.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "pursegraph.settings_test"
