[project]
name = "pursegraph"
version = "0.1.0"
description = "A self-hosted family finance overview"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "django-axes>=8.3.1",
    "gunicorn>=26.2.0",
    "pdfplumber>=0.11.10",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "pursegraph.settings_test"
testpaths = ["tests"]
filterwarnings = ["ignore:No directory at:UserWarning"]
