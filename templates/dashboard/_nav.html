{# A sidebar link to a dashboard view. Needs `name` and `label`; on the dashboard it swaps #view via HTMX. #}
{% url name as href %}<a class="nav{% if nav == name or nav == 'dashboard' and name == 'spending' %} on{% endif %}" href="{{ href }}"{% if view %} hx-get="{{ href }}" hx-target="#view" hx-push-url="true"{% endif %}>{{ label }}</a>
