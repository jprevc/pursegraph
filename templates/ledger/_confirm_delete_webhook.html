{% load i18n %}{# Deleting a Webhook, confirmed inline under its row (docs/design/admin.md). #}
<form class="confirm" method="post" action="{% url 'delete_webhook' webhook.pk %}">
  {% csrf_token %}
  <p>{% blocktranslate with name=webhook.name %}Delete <b>{{ name }}</b>? Pursegraph stops calling it.{% endblocktranslate %}</p>
  <div class="form-actions">
    <a class="button" href="{% url 'categorizers' %}" data-keep>{% translate "Keep it" %}</a>
    <button type="submit" class="primary" data-focus>{% translate "Delete" %}</button>
  </div>
</form>
