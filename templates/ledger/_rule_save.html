{% load i18n %}{# The Rule page's save buttons, which name how many Transactions saving changes; swapped with the preview. #}
<span id="rule-save" class="r-save"{% if oob %} hx-swap-oob="true"{% endif %}>
  {% if p.change %}<button type="submit">{% translate "Future imports only" %}</button>
  <button type="submit" class="primary" name="apply" value="1">{% blocktranslate count n=p.change|length %}Save and change {{ n }}{% plural %}Save and change {{ n }}{% endblocktranslate %}</button>
  {% else %}<button type="submit" class="primary">{% translate "Save Rule" %}</button>{% endif %}
</span>
