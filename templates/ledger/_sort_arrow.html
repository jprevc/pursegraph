{% load i18n icons %}{# One arrow of a sortable column header (_sort_header.html): a link to its sort order, current while that order sorts the rows. Needs `column`, `arrow` and `icon_name`. #}
{% url 'transactions' as here %}<a href="{{ here }}{% if arrow.query %}?{{ arrow.query }}{% endif %}" hx-get="{{ here }}{% if arrow.query %}?{{ arrow.query }}{% endif %}" {% include "ledger/_facet_swap.html" %} aria-label="{% blocktranslate with column=column.label order=arrow.label %}Sort by {{ column }}, {{ order }}{% endblocktranslate %}" title="{{ arrow.label }}"{% if arrow.chosen %} aria-current="true"{% endif %}>{% icon icon_name %}</a>
