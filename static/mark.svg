<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The Pursegraph mark: a two-segment donut on an indigo tile, the same in both themes. -->
  <rect width="32" height="32" rx="8" fill="#4f46e5"/>
  <g fill="none" stroke-width="4.5" transform="rotate(-90 16 16)">
    <circle cx="16" cy="16" r="8" stroke="#fff" stroke-dasharray="33.5 16.77"/>
    <circle cx="16" cy="16" r="8" stroke="#c7d2fe" stroke-dasharray="0 36.7 10.3 3.27"/>
  </g>
</svg>
