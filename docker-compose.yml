services:
  web:
    build: .
    restart: unless-stopped
    # Owns the Statement files on the host.
    user: ${PURSEGRAPH_USER:-1000:1000}
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PURSEGRAPH_STATEMENT_FILES: /data/statement-files
    volumes:
      # The original Statement files, kept so they can be re-parsed after a parser fix.
      - ${PURSEGRAPH_DATA:-./data}/statement-files:/data/statement-files
    ports:
      - "${PURSEGRAPH_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Suggests Subcategories with the local Ollama in the background; imports never wait for it.
  categorize_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    # The web service runs the migrations.
    entrypoint: ["python", "manage.py"]
    command: ["categorize_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly pg_dump, keeping 14 daily and 6 monthly dumps; see "Backups" in the README.
  backup:
    image: postgres:17
    restart: unless-stopped
    # The dumps belong to this host user, who can then copy them off the machine.
    user: ${PURSEGRAPH_USER:-1000:1000}
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      TZ: ${BACKUP_TZ:-UTC}
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
    entrypoint: ["/backup.sh"]
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      # Next to the Statement files, so one host directory holds everything to copy off the machine.
      - ${PURSEGRAPH_DATA:-./data}/backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
