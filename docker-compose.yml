services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      PURSEGRAPH_STATEMENT_FILES: /data/statement-files
    volumes:
      - statement-files:/data/statement-files
    ports:
      - "${PURSEGRAPH_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  # Suggests Subcategories with the local Ollama in the background; imports never wait for it.
  categorize_worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
    # The web service runs the migrations.
    entrypoint: ["python", "manage.py"]
    command: ["categorize_worker"]
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started

  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file: .env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  # The original Statement files, kept so they can be re-parsed after a parser fix.
  statement-files:
