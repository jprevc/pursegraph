<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pursegraph · {{ data.monthLabel }} (prototype {{ variant }})</title>
<script src="https://unpkg.com/htmx.org@2.0.3/dist/htmx.min.js"></script>
{% block libs %}<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>{% endblock %}
<style>
  :root {
    --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --good: #006300; --bad: #d03b3b;
    --accent: #2a78d6;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  h1, h2, h3 { margin: 0; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--ring); border-radius: 10px; padding: 16px; min-width: 0; }
  .panel h2 { font-size: 14px; color: var(--ink-2); margin-bottom: 8px; }
  .chart { width: 100%; height: 300px; }
  .monthnav { display: inline-flex; align-items: center; gap: 6px; }
  .monthnav a, .monthnav span.off { display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 6px; border: 1px solid var(--ring); background: var(--surface); }
  .monthnav span.off { color: var(--axis); }
  .monthnav select { font: inherit; padding: 3px 6px; border-radius: 6px; border: 1px solid var(--ring); background: var(--surface); }
  .badge { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #fff3d6; color: #7a5200; font-size: 12px; font-weight: 600; }
  table.tx { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.tx th { text-align: left; color: var(--muted); font-weight: 500; border-bottom: 1px solid var(--grid); padding: 4px 6px; }
  table.tx td { border-bottom: 1px solid var(--grid); padding: 4px 6px; }
  table.tx td.amt { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pos { color: var(--good); }
  #drill:empty { display: none; }
  #drill { margin-top: 16px; }
  .drill-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  /* prototype switcher: deliberately not part of the design */
  #proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 9999;
    display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px;
    background: #111; color: #fff; box-shadow: 0 6px 24px rgba(0,0,0,.35); font: 600 13px system-ui, sans-serif; }
  #proto-bar button { all: unset; cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 999px; background: #333; }
  #proto-bar button:hover { background: #555; }
  #proto-bar .lbl { padding: 0 12px; white-space: nowrap; }
  #proto-bar .tag { color: #ff0; margin-right: 6px; }
  {% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}

{{ data|json_script:"pg-data" }}
<script>
  var PG_DATA = JSON.parse(document.getElementById('pg-data').textContent);
  const eur = (v, dp = 0) => '€' + Number(v).toLocaleString('en-IE', { minimumFractionDigits: dp, maximumFractionDigits: dp });
  // HTMX drill-down: load the Transactions behind a chart mark into #drill
  function drill(params) {
    const qs = new URLSearchParams(Object.assign({ month: PG_DATA.month }, params));
    for (const [k, v] of [...qs]) if (v === '' || v == null) qs.delete(k);
    htmx.ajax('GET', '/prototype/dashboard/transactions/?' + qs, { target: '#drill', swap: 'innerHTML' })
      .then(() => document.getElementById('drill').scrollIntoView({ behavior: 'smooth', block: 'nearest' }));
  }
</script>
{% block charts %}<script>{% include "charts_echarts.js" %}</script>{% endblock %}
{% block script %}{% endblock %}

{% if debug %}{% include "switcher.html" %}{% endif %}
</body>
</html>
