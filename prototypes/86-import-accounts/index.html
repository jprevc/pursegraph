<!doctype html>
<!-- PROTOTYPE (#86 Import, Accounts and Coverage): throwaway, lives only on prototype/86-import-accounts. Never merge.
     Three variants of the Import page (multi-file progress, per-file outcomes, cause-first rejections, the summary that
     hands over to the Review queue), the Coverage timeline and the Accounts admin page, switchable via ?variant=A|B|C
     (or the black bar, or ← / → while nothing is focused). ?page=import|accounts picks the page. Built inside the chosen
     #63 shell (variant B), desktop only (the map says Import and admin only need to work on desktop).
       A · Batch report      : one column. A results report on top (headline, three tiles, Review now), then one
                               expandable row per file, needs-you first. Coverage is a bar per Account on its own axis,
                               gaps striped as today. Accounts stays a table.
       B · Accounts board    : the page is the Household's Accounts on one shared time axis; files drop anywhere. Results
                               land on their Account's row ("New 1–30 Sep"); files that need you sit in a tray above.
                               Gaps are outlined slots with an Import action. Accounts admin is the same board, rows edit
                               in place.
       C · Guided flow       : Choose → Import → Results steps. Results lead with "Needs you" cards, then a quiet done
                               list, then a hand-over band to the Review queue. Coverage is an Account × month grid that
                               uses the Dashboard's completeness words. Accounts are cards, edited in a side drawer.
     The upload is stubbed (one POST, as the real view: upload progress, then "checking"). The bar runs the import,
     toggles "every rejection" (adds a file for each other rejection cause), admin/member, the theme and a reset.
     Run from the repo root: python3 -m http.server 8086, then open http://localhost:8086/prototypes/86-import-accounts/
     All figures are synthetic. -->

.staged-foot .grow { flex: 1; text-align: left; color: var(--muted); font-size: 13px; }
.progress { height: 6px; border-radius: var(--r-pill); background: var(--ground); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .2s linear; }
.progress.indet i { width: 30% !important; animation: indet 1.1s ease-in-out infinite; }
@keyframes indet { from { transform: translateX(-100%); } to { transform: translateX(340%); } }
.prog-line { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin: 0 0 6px; }
.prog-line b { color: var(--ink); font-weight: 600; }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line-strong); border-top-color: var(--accent); animation: spin .8s linear infinite; display: inline-block; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- Status words (never red/green: icon + word) ---------- */
.status { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.status .icon { width: 16px; height: 16px; }
.status.ok { color: var(--ink); }
.status.ok .icon { color: var(--accent-text); }
.status.need { color: var(--ink); }
.status.need .icon { color: var(--cat-2); }
.status.no { color: var(--ink); }
.status.no .icon { color: var(--ink); }
.status.same { color: var(--muted); font-weight: 500; }

/* ---------- Domain counts ---------- */
.counts { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.counts li { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: var(--s-2); color: var(--ink-2); }
.counts li b { text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
.counts li.zero { color: var(--muted); } .counts li.zero b { color: var(--muted); font-weight: 500; }
.counts a { font-weight: 500; }

/* ---------- Rejection (shared copy) ---------- */
.rej h3 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
.rej p { margin: 0 0 6px; color: var(--ink-2); max-width: 70ch; }
.rej .next { color: var(--ink); }

.diag { margin-top: var(--s-3); padding: var(--s-4); border-radius: var(--r-ctl); background: var(--raised); border: 1px solid var(--line); display: grid; gap: var(--s-4); }
.diag dl { display: grid; grid-template-columns: max-content max-content; gap: 4px var(--s-6); margin: 0; }
.diag dt { color: var(--muted); } .diag dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; font-weight: 500; }
.diag dd.hl, .diag td.hl { font-weight: 700; box-shadow: inset 0 -2px 0 var(--cat-2); }
.mini { border-collapse: collapse; font-size: 13px; }
.mini th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px var(--s-4) 4px 0; border-bottom: 1px solid var(--line); }
.mini td { padding: 4px var(--s-4) 4px 0; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.mini .r { text-align: right; }
.mini tr:last-child td { border-bottom: 0; }

/* ---------- Choose-the-Account step (shared form) ---------- */
.choose { display: grid; gap: var(--s-3); }
.choose fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 6px; }
.choose legend { font-weight: 600; margin-bottom: 6px; }
.choose label.opt { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); cursor: pointer; background: var(--card); }
.choose label.opt:has(input:checked) { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.choose .new-fields { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s-3); padding-left: 28px; }
.field { display: grid; gap: 4px; }
.field > span { font-size: 13px; font-weight: 500; color: var(--ink-2); }
.field input[type=text], .field select { height: 36px; border: 1px solid var(--line-strong); border-radius: var(--r-ctl); padding: 0 10px; font: inherit; background: var(--card); color: var(--ink); }
.field .hint { font-size: 12px; color: var(--muted); }
.checks { display: flex; flex-wrap: wrap; gap: 6px var(--s-4); }
.checks label { display: inline-flex; align-items: center; gap: 6px; }

/* ---------- Coverage: shared bits ---------- */
.seg-list { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 4px var(--s-4); font-size: 13px; color: var(--muted); }
.seg-list .gap-t { color: var(--ink); font-weight: 500; }

/* ---------- A · Batch report ---------- */
.vA-summary { padding: var(--s-5); display: grid; gap: var(--s-4); }
.vA-summary .head { display: flex; align-items: flex-start; gap: var(--s-4); }
.vA-summary h2 { font-size: 20px; font-weight: 600; letter-spacing: -0.015em; }
.vA-summary .sub { color: var(--muted); margin-top: 2px; }
.vA-summary .head .grow { flex: 1; }
.vA-tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s-3); }
.vA-tiles > div { padding: var(--s-3) var(--s-4); border-radius: 10px; background: var(--raised); border: 1px solid var(--line); }
.vA-tiles .k { color: var(--muted); font-size: 13px; font-weight: 500; }
.vA-tiles .v { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.vA-tiles a { font-size: 13px; font-weight: 500; }
.vA-files { margin-top: var(--s-4); }
.vA-file { border-top: 1px solid var(--line); }

.vA-file > summary::-webkit-details-marker { display: none; }

.vA-file > summary .fname small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
.vA-file > summary .gist { color: var(--ink-2); font-size: 13px; }
.vA-file > summary .chev { width: 16px; height: 16px; color: var(--faint); transition: transform .2s; }
.vA-file[open] > summary .chev { transform: rotate(90deg); }
.vA-file .body { padding: 0 var(--s-5) var(--s-5) calc(150px + var(--s-5) + var(--s-4)); }
.vA-cov-row { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: var(--s-5); padding: var(--s-4) var(--s-5); border-top: 1px solid var(--line); }
.vA-cov-row:first-of-type { border-top: 0; }
.acct-name { font-weight: 600; }
.acct-meta { color: var(--muted); font-size: 13px; }
.vA-bar { display: flex; height: 22px; border-radius: 6px; overflow: hidden; gap: 2px; margin-top: 2px; }
.vA-bar span { display: block; min-width: 3px; position: relative; }
.vA-bar .covered { background: var(--cov); }
.vA-bar .covered.new { background: var(--cov-new); }
.vA-bar .gap { background: repeating-linear-gradient(135deg, color-mix(in srgb, var(--ink) 55%, transparent) 0 2px, transparent 2px 6px); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 40%, transparent); }
.vA-ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
.vA-cov-row details { margin-top: var(--s-2); }
.vA-cov-row summary { cursor: pointer; font-size: 13px; color: var(--accent-text); font-weight: 500; width: max-content; }

/* ---------- Statement table (shared) ---------- */
.stmts { width: 100%; border-collapse: collapse; margin-top: var(--s-2); font-size: 13px; }
.stmts th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px var(--s-3) 6px 0; border-bottom: 1px solid var(--line); }

/* ---------- B · Accounts board ---------- */
.vB-banner { display: flex; align-items: center; gap: var(--s-4); padding: var(--s-4) var(--s-5); margin-bottom: var(--s-4); }

.board-axis { padding-top: var(--s-4); padding-bottom: var(--s-2); border-bottom: 1px solid var(--line); }

.board-row { padding-top: var(--s-4); padding-bottom: var(--s-4); border-bottom: 1px solid var(--line); align-items: start; }

.track { position: relative; height: 30px; margin-top: 2px; }
.track::before { content: ""; position: absolute; left: 0; right: 0; top: 14px; border-top: 1px solid var(--line); }

.track .seg { position: absolute; top: 4px; height: 22px; border-radius: 5px; }
.track .seg.covered { background: var(--cov); }
.track .seg.covered.new { background: var(--cov-new); }
.track .seg.gap { top: 4px; background: var(--card); border: 1.5px solid var(--ink-2); display: grid; place-items: center; font-size: 11px; font-weight: 600; color: var(--ink); cursor: pointer; padding: 0; font-family: inherit; overflow: hidden; white-space: nowrap; }
.track .seg.gap:hover { background: var(--hover); }
.track .today { position: absolute; top: -4px; bottom: -4px; border-left: 1.5px solid var(--ink); }
.track .today span { position: absolute; top: -14px; left: -16px; font-size: 10px; color: var(--muted); }
.track-note { display: flex; flex-wrap: wrap; gap: 4px var(--s-4); font-size: 13px; color: var(--muted); margin-top: 6px; }
.track-note .new-t { color: var(--accent-text); font-weight: 600; }
.board-row .expand { grid-column: 1 / -1; padding: var(--s-3) 0 var(--s-2); display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--s-6); }
.board-row .expand h4 { margin: 0 0 var(--s-2); font-size: 13px; font-weight: 600; }
.no-stmts { font-size: 13px; color: var(--muted); padding-top: 6px; }

/* ---------- C · Guided flow ---------- */
.steps { display: flex; align-items: center; gap: var(--s-3); margin: 0 0 var(--s-5); padding: 0; list-style: none; font-size: 13px; color: var(--muted); }
.steps li { display: flex; align-items: center; gap: 8px; }
.steps li .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--line-strong); font-weight: 600; font-size: 12px; background: var(--card); }

.vC-hero { max-width: 760px; margin: 0 auto; }
.vC-group h2 { font-size: 15px; font-weight: 600; margin: var(--s-6) 0 var(--s-3); display: flex; align-items: center; gap: 8px; }

.vC-need { display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: var(--s-3); padding: var(--s-5); margin-bottom: var(--s-3); }

.vC-need .acts { display: flex; gap: var(--s-2); margin-top: var(--s-3); }

.vC-done > li { padding: var(--s-4) var(--s-5); border-top: 1px solid var(--line); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px var(--s-4); }
.vC-done > li:first-child { border-top: 0; }
.vC-done .line1 { font-weight: 600; }
.vC-done .line2 { color: var(--muted); font-size: 13px; grid-column: 1 / -1; }
.vC-done details { grid-column: 1 / -1; margin-top: 6px; }
.vC-done summary { cursor: pointer; color: var(--accent-text); font-size: 13px; font-weight: 500; width: max-content; }
.vC-next { display: flex; align-items: center; gap: var(--s-5); padding: var(--s-6); margin-top: var(--s-6); background: var(--ink); color: var(--card); border-radius: var(--r-card); }
.vC-next .grow { flex: 1; }
.vC-next b { font-size: 18px; display: block; }
.vC-next span { opacity: .75; }
.vC-next .btn { background: var(--card); color: var(--ink); border-color: var(--card); height: 40px; }
.grid-cov { width: 100%; border-collapse: separate; border-spacing: 3px; font-size: 12px; table-layout: fixed; }
.grid-cov th { font-weight: 500; color: var(--muted); padding: 2px; text-align: center; }
.grid-cov th.acct { text-align: left; width: 210px; color: var(--ink); padding-left: var(--s-5); }
.grid-cov th.acct small { display: block; color: var(--muted); font-weight: 400; }
.grid-cov td { height: 40px; border-radius: 6px; text-align: center; vertical-align: middle; padding: 0 2px; line-height: 1.2; }
.grid-cov td.full { background: var(--cov); color: transparent; }
.grid-cov td.full.new { background: var(--cov-new); color: var(--accent-ink); font-weight: 600; }
.grid-cov td.part { background: linear-gradient(90deg, var(--cov) var(--p), transparent var(--p)); box-shadow: inset 0 0 0 1.5px var(--cov); color: var(--ink); font-weight: 600; }
.grid-cov td.gap { box-shadow: inset 0 0 0 1.5px var(--ink-2); color: var(--ink); font-weight: 600; }
.grid-cov td.gap button { font: inherit; font-weight: 600; color: var(--accent-text); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.grid-cov td.none { color: var(--faint); }
.grid-cov td.sofar { box-shadow: inset 0 0 0 1px var(--line-strong); color: var(--muted); }
.grid-legend { display: flex; gap: var(--s-5); padding: var(--s-2) var(--s-5) var(--s-5); font-size: 12px; color: var(--muted); }
.grid-legend i { display: inline-block; width: 14px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.acct-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: var(--s-4); }
.acct-card { padding: var(--s-5); display: grid; gap: var(--s-3); align-content: start; }
.acct-card.flash { animation: flashc 2.4s ease-out; }
@keyframes flashc { from { box-shadow: 0 0 0 3px var(--accent), var(--shadow); } }
.acct-card .top { display: flex; align-items: flex-start; gap: var(--s-2); }
.acct-card .top .grow { flex: 1; }
.acct-card dl { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 4px var(--s-3); margin: 0; font-size: 13px; }
.acct-card dt { color: var(--muted); }
.acct-card dd { margin: 0; }
.drawer-scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .3); z-index: 60; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; background: var(--card); z-index: 61; box-shadow: var(--shadow-pop); padding: var(--s-6); overflow-y: auto; display: grid; gap: var(--s-4); align-content: start; animation: slide .25s cubic-bezier(.16,1,.3,1); }
@keyframes slide { from { transform: translateX(100%); } }
.drawer h2 { font-size: 18px; font-weight: 600; }
.danger-zone { border-top: 1px solid var(--line); padding-top: var(--s-4); display: grid; gap: var(--s-2); }
.danger-zone h3 { font-size: 13px; font-weight: 600; }
.toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 70; background: var(--ink); color: var(--card); padding: 10px 16px; border-radius: var(--r-ctl); box-shadow: var(--shadow-pop); display: flex; align-items: center; gap: 10px; font-weight: 500; }
.toast .icon { width: 16px; height: 16px; }

/* ---------- Confirm dialog (Delete Statement / Account: kept as today) ---------- */
dialog { border: 0; border-radius: var(--r-card); padding: var(--s-6); width: 460px; background: var(--card); color: var(--ink); box-shadow: var(--shadow-pop); }

dialog p { margin: 0 0 var(--s-3); color: var(--ink-2); }
dialog .acts { display: flex; justify-content: flex-end; gap: var(--s-2); margin-top: var(--s-4); }
.btn.danger { color: var(--ink); border-color: var(--ink); font-weight: 600; }
</style>
</head>

<script>
// ===================== Dates and numbers =====================
const DAY = 864e5;
const d = s => Date.UTC(+s.slice(0, 4), +s.slice(5, 7) - 1, +s.slice(8, 10));
const TODAY = d('2026-10-19');
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const P = t => { const x = new Date(t); return [x.getUTCDate(), x.getUTCMonth(), x.getUTCFullYear()]; };
const fd = t => { const [a, m, y] = P(t); return `${a} ${MON[m]} ${y}`; };
function fr(a, b) {
  const [d1, m1, y1] = P(a), [d2, m2, y2] = P(b);
  if (y1 === y2 && m1 === m2) return d1 === d2 ? fd(a) : `${d1}–${d2} ${MON[m1]} ${y1}`;
  if (y1 === y2) return `${d1} ${MON[m1]} – ${d2} ${MON[m2]} ${y2}`;
  return `${fd(a)} – ${fd(b)}`;
}
const monthEnd = (y, m) => Date.UTC(y, m + 1, 0);
const days = (a, b) => Math.round((b - a) / DAY) + 1;
const pl = (n, one, many) => `${n.toLocaleString('sl-SI')} ${n === 1 ? one : many}`;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const ic = n => `<svg class="icon" aria-hidden="true"><use href="#i-${n}"/></svg>`;

function monthly(from, to, fmt, by, base) {
  const out = []; let [y, m] = from.split('-').map(Number); m -= 1;
  const [ty, tm] = to.split('-').map(Number); let i = 0;
  while (y < ty || (y === ty && m <= tm - 1)) {
    const start = Date.UTC(y, m, 1), end = monthEnd(y, m);
    out.push({ start, end, tx: base + ((i * 7 + m * 3) % 19), fmt, at: end + 3 * DAY, by, manual: (i * 5) % 4 });
    i++; m++; if (m === 12) { m = 0; y++; }
  }
  return out;
}

// ===================== Coverage =====================
// Day by day: covered by an older Statement, by one from this import ("new"), or a Gap (up to today).
function coverage(a) {
  if (!a.stmts.length) return [];
  const first = Math.min(...a.stmts.map(s => s.start)), segs = [];
  for (let t = first; t <= TODAY; t += DAY) {
    const k = a.stmts.some(s => !s.new && s.start <= t && t <= s.end) ? 'covered' : a.stmts.some(s => s.new && s.start <= t && t <= s.end) ? 'new' : 'gap';
    const last = segs.at(-1);
    if (last && last.kind === k) last.end = t; else segs.push({ kind: k, start: t, end: t });
  }
  segs.forEach((s, i) => { s.days = days(s.start, s.end); s.trailing = s.kind === 'gap' && i === segs.length - 1; });
  return segs;
}
const gaps = a => coverage(a).filter(s => s.kind === 'gap');
const lastEnd = a => Math.max(...a.stmts.map(s => s.end));
const gapText = g => g.trailing ? `Gap ${fr(g.start, g.end)}, since the last Statement` : `Gap ${fr(g.start, g.end)}`;
const segText = s => s.kind === 'gap' ? gapText(s) : `${s.kind === 'new' ? 'Covered by this import' : 'Covered'} ${fr(s.start, s.end)}`;
const srList = a => `<ol class="sr">${coverage(a).map(s => `<li>${segText(s)}</li>`).join('')}</ol>`;

  return `<ul class="counts">

    ${li(c.dup, c.dup ? `${c.dup === 1 ? 'Duplicate' : 'Duplicates'} skipped: already imported from an earlier Statement` : 'Duplicates')}
    ${li(c.pending, `card payments still pending or declined, left out`, c.pending > 0)}
    ${li(tr, tr ? `${tr === 1 ? 'Transfer' : 'Transfers'} recognised: ${c.paired} paired, ${c.oneSided} one-sided` : 'Transfers')}
    ${li(c.converted, `categorized Transaction is now a Transfer`, c.converted > 0)}
    ${li(c.ambiguous, `Transfer has several possible other sides, so it waits in the Review queue`, c.ambiguous > 0)}
    ${li(c.rules, 'categorized by Rules')}
    ${li(c.waiting, `wait for suggestions and review · <a href="#">Review queue</a>`)}
  </ul>`;
}

      next: "Download the Statement from your bank's website or app and import that; scans and photos can't be read. If this is a downloaded Statement, keep it: the reader may need a fix.",

function covGrid() {
  const months = []; for (let i = 12; i >= 0; i--) { const t = new Date(Date.UTC(2026, 9 - i, 1)); months.push([t.getUTCFullYear(), t.getUTCMonth()]); }
  const cell = (a, [y, m]) => {
    const s = Date.UTC(y, m, 1), e = Math.min(monthEnd(y, m), TODAY), segs = coverage(a);
    const running = monthEnd(y, m) > TODAY, label = `${MONTH[m]} ${y}`;
    if (!segs.length || e < segs[0].start) return `<td class="none" aria-label="${label}: not tracked">·</td>`;
    const inM = segs.filter(g => g.end >= s && g.start <= e).map(g => ({ ...g, start: Math.max(g.start, s), end: Math.min(g.end, e) }));
    const cov = inM.filter(g => g.kind !== 'gap').reduce((n, g) => n + days(g.start, g.end), 0), all = days(s, e), isNew = inM.some(g => g.kind === 'new');

    if (cov === 0) return `<td class="gap"><button type="button" data-gap="${a.id}:${gp.start}:${gp.end}" aria-label="${label}: no Statement. Import one">Import</button></td>`;

function url() {
  const p = new URLSearchParams({ variant: S.variant, page: S.page });
  if (S.stage === 'done') p.set('stage', 'done'); if (S.all) p.set('all', 1); if (S.role === 'member') p.set('role', 'member');
  const t = document.documentElement.dataset.theme; if (t !== 'system') p.set('theme', t);
  return `?${p}`;
}
function render(focus) {
  document.body.className = 'vB';
  let content = S.page === 'accounts' && !isAdmin() ? `<div class="title-row"><h1>Accounts</h1></div><p class="muted">Only admins manage Accounts. Your Accounts and their Coverage are on Import.</p>` : PAGES[S.page]?.[S.variant]?.() ?? `<div class="title-row"><h1>Not in this prototype</h1></div>`;
  document.getElementById('app').innerHTML = `<a class="skip" href="#main">Skip to content</a>` + shell(content);
  document.title = `${S.page === 'accounts' ? 'Accounts' : 'Import'} · Pursegraph`;
  history.replaceState(null, '', url());
  renderProto();
  if (focus) document.querySelector(focus)?.focus();
}
function announce(text) { S.said = text; const live = document.getElementById('live'); live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); renderProto(); }

// ===================== The import (stubbed: one POST, like the real view) =====================
let timer;
function finish() {
  clearInterval(timer);
  RESULTS = batch().map(f => ({ ...f }));
  for (const r of RESULTS.filter(r => r.kind === 'ok')) acct(r.acct).stmts.push({ start: r.start, end: r.end, tx: r.c.imported + r.c.dup, fmt: r.fmt, at: TODAY, by: me(), manual: 0, new: true });
  S.stage = 'done'; S.lookFor = null;
  render('#sum-h');
  const h = headline(); announce(`Import finished. ${h.title}. ${waiting()} wait for review. ${h.sub}.`);
}
function go() {
  S.stage = 'uploading'; S.pct = 0; render(); announce(`Uploading ${pl(batch().length, 'file', 'files')}.`);
  timer = setInterval(() => {
    S.pct = Math.min(100, S.pct + 9);
    if (S.pct < 100) { const bar = document.querySelector('.progress i'); if (bar) bar.style.width = S.pct + '%'; const l = document.querySelector('.prog-line .num'); if (l) l.textContent = S.pct + ' %'; return; }
    clearInterval(timer); S.stage = 'checking'; render(); announce('Upload finished. Checking and importing.');
    timer = setTimeout(finish, 2000);
  }, 140);
}
function resolve(form) {
  const r = RESULTS.find(x => x.file === form.dataset.choose), fdata = new FormData(form), choice = fdata.get('acct');
  let a;
  if (choice === 'new') { a = { id: Math.max(...ACCOUNTS.map(x => x.id)) + 1, name: fdata.get('name') || 'New Account', bank: 'Revolut', owners: fdata.getAll('own'), ibans: [r.iban], rules: 0, stmts: [] }; ACCOUNTS.splice(ACCOUNTS.length - 1, 0, a); }
  else { a = acct(+choice); a.ibans.push(r.iban); }
  Object.assign(r, { kind: 'ok', acct: a.id });
  a.stmts.push({ start: r.start, end: r.end, tx: r.c.imported, fmt: r.fmt, at: TODAY, by: me(), manual: 0, new: true });
  render('#sum-h'); announce(`Imported ${r.file} into ${a.name}: ${pl(r.c.imported, 'Transaction', 'Transactions')}, ${r.c.waiting} to review.`);
}
function saveAccount(form) {
  const fdata = new FormData(form), id = form.dataset.save;
  const vals = { name: fdata.get('name'), bank: fdata.get('bank'), owners: fdata.getAll('own'), ibans: String(fdata.get('ibans')).split(',').map(s => s.trim()).filter(Boolean) };
  let a;
  if (id === 'new') { a = { id: Math.max(...ACCOUNTS.map(x => x.id)) + 1, rules: 0, stmts: [], none: vals.bank === 'Other', ...vals }; ACCOUNTS.push(a); }
  else { a = acct(+id); Object.assign(a, vals); }
  S.editing = null; S.saved = a.id; S.toast = S.variant === 'C' ? `Saved ${a.name}` : null;
  render(); announce(`Saved ${a.name}.`);
  setTimeout(() => { S.toast = null; if (S.variant === 'C') document.querySelector('.toast')?.remove(); }, 3000);
}

// ===================== Delete confirmations (the trust ritual, kept) =====================
function confirmDelete(html) { const dlg = document.getElementById('dlg'); dlg.innerHTML = html; dlg.showModal(); }
function askDeleteStatement(id, start) {
  const a = acct(id), s = a.stmts.find(x => x.start === start), lost = Math.round(s.tx * .8);
  confirmDelete(`<h2>Delete this Statement?</h2><p><b>${esc(a.name)}</b>: ${fr(s.start, s.end)}</p>
    <p>${pl(lost, 'Transaction appears', 'Transactions appear')} on no other Statement and will be deleted with it. ${fr(s.start, s.end)} becomes a Gap in ${esc(a.name)}'s Coverage.</p>
    <p>${s.manual ? `<b>${pl(s.manual, 'outcome set by hand', 'outcomes set by hand')} will be lost.</b>` : 'No outcomes set by hand will be lost.'}</p>
    <form method="dialog" class="acts"><button class="btn" value="no">Cancel</button><button class="btn danger" value="yes" data-confirm="stmt:${id}:${start}">Delete Statement</button></form>`);
}
function askDeleteAccount(id) {
  const a = acct(id);
  confirmDelete(`<h2>Delete ${esc(a.name)}?</h2><p>${a.rules ? `<b>${pl(a.rules, 'Rule only for this Account', 'Rules only for this Account')} will be deleted with it.</b>` : 'No Rules are only for this Account.'}</p>
    <p>Money moved to its IBAN ${esc(a.ibans[0])} will no longer count as a Transfer.</p>
    <form method="dialog" class="acts"><button class="btn" value="no">Cancel</button><button class="btn danger" value="yes" data-confirm="acct:${id}">Delete Account</button></form>`);
}

// ===================== Prototype switcher (not the design) =====================
function renderProto() {
  document.getElementById('proto').innerHTML = `<button type="button" data-proto="-1" aria-label="Previous variant">‹</button>
    <span class="lbl">${S.variant} <small>(${VARIANTS[S.variant]})</small></span>
    <button type="button" data-proto="1" aria-label="Next variant">›</button>
    <button class="toggle" type="button" data-proto="page">${S.page === 'import' ? 'page: Import' : 'page: Accounts'}</button>
    <button class="toggle" type="button" data-proto="run">${S.stage === 'done' ? 'results ✓' : 'jump to results'}</button>
    <button class="toggle" type="button" data-proto="all" title="Add a file for every other rejection cause">${S.all ? 'every rejection ✓' : 'every rejection'}</button>
    <button class="toggle" type="button" data-proto="role">${S.role === 'admin' ? 'as Maja (admin)' : 'as Luka (member)'}</button>
    <button class="toggle" type="button" data-proto="theme">${document.documentElement.dataset.theme}</button>
    <button class="toggle" type="button" data-proto="reset">reset</button>
    <span class="state" title="The last screen-reader announcement">${S.said ? `said: “${esc(S.said)}”` : 'said: —'}</span>`;
}
function resetAll() { clearInterval(timer); clearTimeout(timer); seed(); S.stage = 'idle'; S.removed = new Set(); S.open = {}; S.editing = null; S.saved = null; S.lookFor = null; }

// ===================== Events =====================
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-choosefiles],[data-go],[data-reset],[data-remove],[data-gap],[data-lookfor],[data-toggle],[data-edit],[data-cancel],[data-delstmt],[data-delacct],[data-confirm],[data-proto],a[href="#"]');
  if (!t) return;
  const dd = t.dataset;
  if (dd.confirm) { const [k, id, start] = dd.confirm.split(':');
    if (k === 'stmt') { const a = acct(+id); a.stmts = a.stmts.filter(s => s.start !== +start); announce(`Deleted the Statement. ${a.name}'s Coverage shrank to match.`); }
    else { ACCOUNTS.splice(ACCOUNTS.findIndex(a => a.id === +id), 1); announce('Deleted the Account.'); }
    setTimeout(() => render(), 0); return; }
  e.preventDefault();
  if (dd.nav) { if (dd.nav === 'import' || dd.nav === 'accounts') { S.page = dd.nav; S.editing = null; S.saved = null; render('#main'); } return; }
  if (dd.choosefiles !== undefined) { S.stage = 'staged'; S.removed = new Set(); render('[data-go]'); announce(`${pl(batch().length, 'file', 'files')} chosen.`); return; }
  if (dd.go !== undefined) { go(); return; }
  if (dd.reset !== undefined) { clearInterval(timer); S.stage = 'idle'; render('#main'); return; }
  if (dd.remove) { S.removed.add(dd.remove); if (!batch().length) S.stage = 'idle'; render('[data-go]'); return; }
  if (dd.gap) { const [id, s, en] = dd.gap.split(':').map(Number); S.lookFor = { acct: id, start: s, end: en }; if (S.stage === 'done' && S.variant === 'C') S.stage = 'idle'; S.page = 'import'; render(); document.querySelector('.notice')?.scrollIntoView({ block: 'center' }); document.querySelector('[data-choosefiles]')?.focus(); return; }
  if (dd.lookfor) { S.lookFor = null; render(); return; }
  if (dd.toggle) { S.open[dd.toggle] = !S.open[dd.toggle]; S.editing = null; render(`[data-toggle="${dd.toggle}"]`); return; }
  if (dd.edit) { S.editing = dd.edit === 'new' ? 'new' : +dd.edit; S.saved = null; render('form[data-save] input'); return; }
  if (dd.cancel !== undefined) { const id = S.editing; S.editing = null; render(id != null && id !== 'new' ? `[data-edit="${id}"]` : null); return; }
  if (dd.delstmt) { const [id, s] = dd.delstmt.split(':').map(Number); askDeleteStatement(id, s); return; }
  if (dd.delacct) { askDeleteAccount(+dd.delacct); return; }
  if (dd.proto) {
    const keys = Object.keys(VARIANTS);
    if (dd.proto === 'page') { S.page = S.page === 'import' ? 'accounts' : 'import'; S.editing = null; }
    else if (dd.proto === 'run') { if (S.stage !== 'done') { resetAll(); finish(); return; } }
    else if (dd.proto === 'all') { S.all = !S.all; if (S.stage === 'done') { resetAll(); finish(); return; } }
    else if (dd.proto === 'role') S.role = S.role === 'admin' ? 'member' : 'admin';
    else if (dd.proto === 'theme') { const order = ['system', 'light', 'dark'], h = document.documentElement; h.dataset.theme = order[(order.indexOf(h.dataset.theme) + 1) % 3]; }
    else if (dd.proto === 'reset') resetAll();
    else { S.variant = keys[(keys.indexOf(S.variant) + +dd.proto + keys.length) % keys.length]; S.editing = null; }
    render(); return;
  }
});
document.addEventListener('submit', e => {
  if (e.target.dataset.choose) { e.preventDefault(); resolve(e.target); }
  else if (e.target.dataset.save) { e.preventDefault(); saveAccount(e.target); }
});
document.addEventListener('toggle', e => { const k = e.target.dataset?.keep; if (k) S.open[k] = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.editing != null && S.variant === 'C') { const id = S.editing; S.editing = null; render(`[data-edit="${id}"]`); return; }
  if (e.target !== document.body && e.target.id !== 'main') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]; S.editing = null; render(); }
});
// Drag-and-drop stands in for "Choose files": dropping anything stages the synthetic batch.
document.addEventListener('dragover', e => { if (S.page === 'import') e.preventDefault(); });
document.addEventListener('drop', e => { if (S.page !== 'import') return; e.preventDefault(); S.stage = 'staged'; S.removed = new Set(); render('[data-go]'); });

if (qs.get('theme')) document.documentElement.dataset.theme = qs.get('theme');
seed();
if (qs.get('stage') === 'done') finish(); else render();
</script>
</body>
</html>
