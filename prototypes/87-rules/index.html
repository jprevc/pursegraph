<!doctype html>
<!-- PROTOTYPE (#87 Rules): throwaway, lives only on prototype/87-rules. Never merge.
     Three variants of the Rules pages, switchable via ?variant=A|B|C (or the black bar, or ← / → while nothing is
     focused), each covering: Make a Rule from the Review queue (#83's "Saved as … · Undo · Make a Rule"), the live
     "matches N" preview, the Rules list with per-Rule effect counts and reordering, and Delete.
       A · Rules table + Rule page : a table with counts, drag plus ↑ ↓; the Rule is its own page, form left,
                                     live preview right; Delete asks in a modal dialog.
       B · Sentences, in place     : each Rule is a sentence; editing (and Make a Rule, under the Review queue row)
                                     opens a sentence builder in place; order is a "1st / 2nd …" select; Delete has no
                                     confirmation, it offers Undo instead.
       C · Saved filter            : a master/detail list (drag, or Alt+↑/↓); a Rule's page is a filter bar over the
                                     Transactions it would catch, each with Now → After; Delete confirms inline.
     The matching engine mirrors ledger/rules.py (unaccented contains, exact IBAN, direction, Account; only awaiting,
     LLM and Rule outcomes are overwritten). Saves are in memory.
     Run from the repo root: python3 -m http.server 8087, then open http://localhost:8087/prototypes/87-rules/
     All figures are synthetic. -->

/* =====================================================================

.vB .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

const PROCESSORS = ['PAYPAL', 'SUMUP', 'SQ', 'ZETTLE', 'IZETTLE', 'GOOGLE'];

  for (let i = 0; i < words.length; i++) for (let j = i; j < words.length; j++)

}

  else if (k > r[1]) r = [r[0], k];
  else if (r[0] === r[1]) r = null;
  else if (k === r[0]) r = [k + 1, r[1]];
  else if (k === r[1]) r = [r[0], k - 1];

function saveRule(d, apply) {

    w.push(`${pl(diff.length, 'of them was', 'of them were')} set by hand to something else, such as ${ex}. A new one like ${diff.length === 1 ? 'it' : 'them'} would become ${esc(plain(d.out))} at import.`);
  }
  Object.entries(P.fromRules).forEach(([id, n]) => { const r = ruleById(+id); w.push(`Takes ${pl(n, 'Transaction')} over from Rule ${posOf(r.id)} (${esc(ruleName(r))}).`); });
  Object.entries(P.shadow).forEach(([id, n]) => { const r = ruleById(+id); w.push(`At import, Rule ${posOf(r.id)} (${esc(ruleName(r))}) above wins on ${n} of these.`); });
  return w.map(t => `<div class="pv-warn">${ic('alert')}<span>${t}</span></div>`).join('');
}
function pvList(P, d, max = 8) {

  };
  return `<ul class="pv-list">${list.slice(0, max).map(li).join('')}</ul>${list.length > max ? `<details><summary class="cap" style="cursor:pointer;padding-top:6px">and ${list.length - max} more</summary><ul class="pv-list">${list.slice(max).map(li).join('')}</ul></details>` : ''}`;
}

// ===================== Review queue (the entry point for Make a Rule) =====================
function pageReview() {
  const q = TX.filter(x => x.queue).sort((a, b) => (b.justSaved - a.justSaved) || b.date.localeCompare(a.date));
  const waiting = q.filter(x => !x.justSaved).length;

    const inline = S.variant === 'B' && S.d && S.origin === 'review' && S.d.from === x.id ? `<tr class="inline"><td colspan="4">${builderB(S.d)}</td></tr>` : '';

  if (S.variant === 'B' && S.page === 'edit') S.page = S.origin === 'review' ? 'review' : 'rules';
  if (S.frame && !S.framed) {
    document.getElementById('app').innerHTML = `<div class="frame-wrap"><iframe title="Phone, 390 × 844" src="${url({ framed: 1, frame: 0 })}"></iframe></div>`;
  } else {
    document.getElementById('app').innerHTML = `<a class="skip" href="#main">Skip to content</a>` + shell(content()) + (S.toast ? `<div class="toast" role="status">${S.toast}</div>` : '');
    document.title = `${S.page === 'review' ? 'Review queue' : 'Rules'} · Pursegraph`;
  }
  history.replaceState(null, '', url());
  renderProto();
  const dlg = document.getElementById('confirm'); if (dlg && !dlg.open) { dlg.showModal(); dlg.addEventListener('close', () => { S.del = null; }); dlg.querySelector('[data-cancel-del]').focus(); }
  if (focus) { const el = document.querySelector(focus); if (el) { el.focus(); if (el.setSelectionRange && el.type !== 'checkbox' && typeof el.value === 'string') el.setSelectionRange(el.value.length, el.value.length); } }
}
// Live preview: only the preview regions repaint, so typing keeps its caret.
function refreshPreview() {
  const d = S.d, P = preview(d), pv = document.getElementById('pv');
  if (pv) pv.innerHTML = S.variant === 'A' ? pvSummary(P, d) + pvList(P, d) : S.variant === 'B' ? pvB(P, d) : pvC(P, d);
  const w = document.getElementById('words'); if (w && d.words) w.outerHTML = wordChips(d);
  const al = document.getElementById('apply-lbl'); if (al) al.textContent = applyLabelA(d);
  const sw = document.getElementById('save-wrap'); if (sw) sw.innerHTML = saveC(P, d);
  if (S.variant === 'B') { const n = P.change.length, s = document.getElementById('save'); if (s) { s.textContent = n ? `Save and change ${n}` : 'Save Rule'; s.disabled = P.empty || d.out === ''; }
    const fut = document.querySelector('[data-save="future"]'); if (fut) fut.hidden = !n; }
  S.said = P.empty ? 'No condition yet' : `Matches ${P.all.length}, ${P.change.length} would change`; renderProto();
}
function announce(text) { S.said = text; const live = document.getElementById('live'); live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); renderProto(); }
function toast(text) { S.toast = text; clearTimeout(S.toastT); S.toastT = setTimeout(() => { S.toast = null; document.querySelector('.toast')?.remove(); }, 6000); }

// ===================== Prototype switcher (not the design) =====================
function renderProto() {
  if (S.framed) return;
  document.getElementById('proto').innerHTML = `<button type="button" data-proto="-1" aria-label="Previous variant">‹</button>
    <span class="lbl">${S.variant} <small>(${VARIANTS[S.variant]})</small></span>
    <button type="button" data-proto="1" aria-label="Next variant">›</button>
    <span class="state" title="Last announcement / live preview">${S.said ? `said: “${esc(S.said)}”` : 'said: —'}</span>
    <button class="toggle" type="button" data-proto="page">${S.page === 'review' ? 'go: Rules' : 'go: Review queue'}</button>
    <button class="toggle" type="button" data-proto="frame">${S.frame ? 'phone ✓' : 'phone'}</button>
    <button class="toggle" type="button" data-proto="theme">${document.documentElement.dataset.theme}</button>
    <button class="toggle" type="button" data-proto="reset">reset</button>`;
}

// ===================== Events =====================
function openEdit(d, origin) {
  S.d = d; S.origin = origin; S.apply = true; S.del = null; S.notice = null; S.gone = null;
  if (S.variant === 'B') { S.page = origin === 'review' ? 'review' : 'rules'; render('#b-contains'); }
  else { S.page = 'edit'; render('#f-contains'); window.scrollTo(0, 0); }
}
function closeEdit() {
  const back = S.origin; S.d = null; S.page = back === 'review' ? 'review' : 'rules'; render('#main');
}
function doSave(apply) {
  const d = S.d, P = preview(d);
  if (P.empty || d.out === '') return;
  const isNew = !d.id, { r, changed } = saveRule(d, apply);
  const msg = `${isNew ? 'Saved' : 'Updated'} the Rule ${ruleName(r)}${isNew ? ', first in the order' : ''}. ${apply ? (changed ? `${pl(changed, 'existing Transaction')} changed to ${plain(r.out)}.` : 'No existing Transaction changed.') : 'It applies from the next import.'}`;
  S.d = null; S.fresh = r.id; S.sel = r.id;
  if (S.variant === 'C') { toast(esc(msg)); S.notice = null; } else S.notice = esc(msg);
  S.page = S.variant === 'B' && S.origin === 'review' ? 'review' : 'rules';
  render('#main'); announce(msg);
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-make],[data-new],[data-edit],[data-cancel],[data-save],[data-word],[data-use-iban],[data-move],[data-del],[data-cancel-del],[data-confirm-del],[data-undo-del],[data-dismiss],[data-sel],[data-back],[data-proto],a[href="#"]');
  if (!t) return;
  const d = t.dataset;
  if (t.tagName === 'A' || d.proto || d.nav) e.preventDefault();
  if (d.nav) { S.page = d.nav; S.d = null; S.notice = null; S.del = null; render('#main'); return; }
  if (d.make) { openEdit(draftFrom(TX.find(x => x.id === d.make)), 'review'); return; }
  if (d.new !== undefined) { openEdit(blankDraft(), 'rules'); return; }
  if (d.edit) { if (S.variant === 'B' && S.d && S.d.id === +d.edit) { S.d = null; render(`[data-edit="${d.edit}"]`); return; } openEdit(draftOf(ruleById(+d.edit)), 'rules'); return; }
  if (d.cancel !== undefined) { closeEdit(); return; }
  if (d.save !== undefined) { doSave(S.variant === 'A' ? S.apply : d.save !== 'future'); return; }
  if (d.word) { clickWord(S.d, +d.word); render(`#w-${d.word}`); refreshPreview(); return; }
  if (d.useIban !== undefined) { const x = TX.find(t => t.id === S.d.from); S.d.iban = x.iban; render('#f-iban'); return; }
  if (d.move) { const [id, dir] = d.move.split(':'); const i = posOf(+id) - 1; moveTo(+id, dir === 'up' ? i - 1 : i + 1); S.fresh = null;
    const r = ruleById(+id); announce(`Moved ${ruleName(r)} to ${ORD(posOf(+id))}.`); render(document.querySelector(`#${dir}-${id}`) ? `#${dir}-${id}` : null); if (document.activeElement?.disabled || document.activeElement === document.body) document.querySelector(`#${dir === 'up' ? 'down' : 'up'}-${id}`)?.focus(); return; }
  if (d.del) {
    if (S.variant === 'B') { // B: no confirmation; Undo instead.
      S.gone = deleteRule(+d.del); S.d = null; S.notice = null; render('[data-undo-del]'); announce(`Deleted the Rule ${ruleName(S.gone.r)}. Undo is available.`); return;
    }
    if (S.variant === 'A' && S.page === 'edit') { S.page = 'rules'; S.d = null; }
    S.del = +d.del; S.sel = +d.del; render(S.variant === 'C' ? '#confirm-del' : null); return;
  }
  if (d.cancelDel !== undefined) { const id = S.del; S.del = null; render(`#del-${id}`); return; }
  if (d.confirmDel) { const g = deleteRule(+d.confirmDel); S.del = null; S.sel = RULES[Math.min(g.i, RULES.length - 1)]?.id; const msg = `Deleted the Rule ${ruleName(g.r)}.${g.n ? ` The ${pl(g.n, 'Transaction')} it categorized keep their outcome.` : ''}`;
    if (S.variant === 'C') toast(esc(msg)); else S.notice = esc(msg); render('#main'); announce(msg); return; }
  if (d.undoDel !== undefined) { const g = S.gone; restoreRule(g); S.gone = null; render(`[data-edit="${g.r.id}"]`); announce(`Restored the Rule ${ruleName(g.r)}.`); return; }
  if (d.dismiss !== undefined) { S.notice = null; S.fresh = null; render('#main'); return; }
  if (d.sel) { S.sel = +d.sel; S.del = null; S.mobileDetail = true; render(`#opt-${d.sel}`); return; }
  if (d.back !== undefined) { S.mobileDetail = false; render(`#opt-${S.sel}`); return; }
  if (d.proto) {
    const keys = Object.keys(VARIANTS);
    if (d.proto === 'frame') S.frame = !S.frame;
    else if (d.proto === 'page') { S.page = S.page === 'review' ? 'rules' : 'review'; S.d = null; }
    else if (d.proto === 'theme') { const order = ['system', 'light', 'dark'], h = document.documentElement; h.dataset.theme = order[(order.indexOf(h.dataset.theme) + 1) % 3]; }
    else if (d.proto === 'reset') { seed(); Object.assign(S, { d: null, notice: null, fresh: null, del: null, gone: null, sel: RULES[0].id, said: '', toast: null }); }
    else { S.variant = keys[(keys.indexOf(S.variant) + +d.proto + keys.length) % keys.length]; S.del = null; S.gone = null; S.notice = null;
      if (S.d && S.variant !== 'B' && (S.page === 'review' || S.page === 'rules')) S.page = 'edit'; }
    render(); return;
  }
});
document.addEventListener('input', e => {
  const f = e.target.dataset.f; if (!f || !S.d || e.target.tagName === 'SELECT') return;
  S.d[f] = e.target.value;
  if (f === 'contains' && S.d.words) S.d.range = rangeFor(S.d.words, e.target.value);
  refreshPreview();
});
document.addEventListener('change', e => {
  if (e.target.dataset.apply !== undefined) { S.apply = e.target.checked; return; }
  if (e.target.dataset.order) { const id = +e.target.dataset.order; moveTo(id, +e.target.value); S.fresh = id; announce(`Moved ${ruleName(ruleById(id))} to ${ORD(posOf(id))}.`); render(`#ord-${id}`); return; }
  const f = e.target.dataset.f; if (!f || !S.d || e.target.tagName !== 'SELECT') return;
  const v = e.target.value; S.d[f] = f === 'out' ? (v === '' || v === 'transfer' ? v : +v) : v;
  render(`#${e.target.id}`);
});
// Drag to reorder (A's rows, C's list); the buttons / Alt+arrows are the keyboard alternative.
let dragged = null;
document.addEventListener('dragstart', e => { const row = e.target.closest?.('[data-dragrow]'); if (!row) return; dragged = row; row.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
document.addEventListener('dragover', e => {
  const over = e.target.closest?.('[data-dragrow]'); if (!dragged || !over || over === dragged) return; e.preventDefault();
  const box = over.getBoundingClientRect(); over.parentNode.insertBefore(dragged, e.clientY > box.top + box.height / 2 ? over.nextSibling : over);
});
document.addEventListener('drop', e => { if (dragged) e.preventDefault(); });
document.addEventListener('dragend', () => {
  if (!dragged) return; const ids = [...dragged.parentNode.querySelectorAll('[data-dragrow]')].map(el => +el.dataset.dragrow);
  const id = +dragged.dataset.dragrow; dragged = null;
  RULES.sort((a, b) => ids.indexOf(a.id) - ids.indexOf(b.id)); S.fresh = id; announce(`Moved ${ruleName(ruleById(id))} to ${ORD(posOf(id))}.`); render();
});
document.addEventListener('keydown', e => {
  // C: the list is a listbox; ↑/↓ select, Alt+↑/↓ move the selected Rule.
  const opt = e.target.closest?.('.rl [data-sel]');
  if (opt && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
    e.preventDefault(); const id = +opt.dataset.sel, i = posOf(id) - 1, j = e.key === 'ArrowUp' ? i - 1 : i + 1;
    if (j < 0 || j >= RULES.length) return;
    if (e.altKey) { moveTo(id, j); announce(`Moved ${ruleName(ruleById(id))} to ${ORD(j + 1)}.`); render(`#opt-${id}`); }
    else { S.sel = RULES[j].id; render(`#opt-${S.sel}`); }
    return;
  }
  if (opt && e.key === 'Enter') { S.mobileDetail = true; render(`#opt-${opt.dataset.sel}`); return; }
  if (e.key === 'Escape' && S.d && S.variant === 'B') { closeEdit(); return; }
  if (e.target !== document.body && e.target.id !== 'main') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { e.preventDefault(); document.querySelector(`[data-proto="${e.key === 'ArrowLeft' ? -1 : 1}"]`)?.click(); }
});
render();
</script>
</body>
</html>
