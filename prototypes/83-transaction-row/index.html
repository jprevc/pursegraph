<!doctype html>
<!-- PROTOTYPE (#83 Transaction row and outcome control): throwaway, lives only on prototype/83-transaction-row. Never merge.
     Three variants of the shared Transaction row + outcome control, switchable via ?variant=A|B|C (or the black bar,
     or ← / → while nothing is focused), each on the three surfaces that use it: Review queue (editing),
     Transactions and the Dashboard drill-down (reading). Built inside the chosen #63 shell (variant B).
       A · Chip + search picker      : the outcome is a chip; it opens a searchable listbox (Suggested, Most used, every
                                       Category, Transfer). Arrows only move the highlight; Enter or a click saves.
       B · Text + Change, chip panel : the outcome is text; Change / Choose opens a panel under the row with Most used
                                       chips, then Category → Subcategory chips. A tap on a Subcategory saves.
       C · Native select + Save      : the select, labelled "Category › Subcategory", only stages; Save / Accept (or
                                       Enter) commits. Works without JS.
       D · Chosen (#83 verdict)      : B, but on a coarse pointer Change / Choose / Something else is a native select
                                       that saves on pick. The bar's "touch" toggle fakes a coarse pointer on desktop.
     Saves are stubbed (400 ms). The bar toggles a 390 px phone frame, failing saves, the theme and a reset; it also shows
     the last screen-reader announcement.
     Run from the repo root: python3 -m http.server 8083, then open http://localhost:8083/prototypes/83-transaction-row/
     All figures are synthetic. -->

/* ---------- Base ---------- */

.avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-text); display: grid; place-items: center; font-weight: 600; font-size: 13px; flex: none; }

/* =====================================================================
   Variant B · Few destinations (jobs, not modules)
   ===================================================================== */
.vB .shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }

.vB .nav:hover { background: var(--hover); color: var(--ink); }

// ===================== Synthetic Household (the seeded Category list) =====================
const CATEGORY_LIST = [

const CATS = CATEGORY_LIST.map(([name, subs], i) => ({ id: i + 1, name, hue: i % 10, subs: subs.map((s, j) => (i + 1) * 100 + j + 1) }));
const SUBS = {};
CATS.forEach(c => c.subs.forEach((id, j) => { SUBS[id] = { id, name: CATEGORY_LIST[c.id - 1][1][j], cat: c.name, hue: c.hue }; }));
const sub = (cat, name) => Object.values(SUBS).find(s => s.cat === cat && s.name === name).id;
// The Household's most-used outcomes (would come from a count over its Transactions).
const MOST_USED = [sub('Food', 'Groceries'), sub('Transport', 'Fuel'), sub('Food', 'Restaurants & cafés'), sub('Home', 'Utilities'), sub('Leisure', 'Subscriptions & digital services')];

seed();

const fmt = new Intl.NumberFormat('sl-SI', { style: 'currency', currency: 'EUR', useGrouping: 'always' });

const resolved = r => r.done || (surface() === 'read');

function dot(v) {
  if (v == null) return `<span class="dot hatch" aria-hidden="true"></span>`;

  if (v == null || v === 'transfer' || String(v).startsWith('pair')) return esc(plain(v, r));

// ===================== Variant A · chip + searchable picker =====================
function optionsFor(r) {
  const q = fold(S.q.trim()), opts = [];
  const add = (section, value, html, k = '') => opts.push({ section, value, html, k });
  if (!q) {
    if (r.pairs) r.pairs.forEach(p => add('Transfer: the other side', p.id, `${dot('pair')}<span>${esc(p.date)} · ${esc(p.account)} · ${esc(p.desc)}</span>`, signed(p.amount)));
    if (r.sugg && !r.done) add('Suggested', r.sugg, `${dot(r.sugg)}<span>${rich(r.sugg)}</span>`, pct(r));
    MOST_USED.forEach(v => add('Most used', v, `${dot(v)}<span>${rich(v)}</span>`));
    CATS.forEach(c => c.subs.forEach(v => add(c.name, v, `${dot(v)}<span>${esc(SUBS[v].name)}</span>`)));
    add('Not spending or income', 'transfer', `${dot('transfer')}<span>Transfer${r.pairs ? ', one-sided' : ''}</span>`);
  } else {
    Object.values(SUBS).filter(s => fold(`${s.cat} ${s.name}`).includes(q)).forEach(s => add('Matches', s.id, `${dot(s.id)}<span>${rich(s.id)}</span>`));
    if (fold('transfer').includes(q)) add('Matches', 'transfer', `${dot('transfer')}<span>Transfer</span>`);

  return opts;
}
function listboxItems(r) {
  const opts = optionsFor(r); let html = '', last = null;
  if (!opts.length) return `<li class="lb-empty" role="presentation">No outcome matches “${esc(S.q)}”</li>`;
  opts.forEach((o, i) => {
    if (o.section !== last) {
      const cat = CATS.find(c => c.name === o.section);
      html += `<li class="lb-h" role="presentation">${cat ? `<span class="dot" style="background:var(--cat-${cat.hue})"></span>` : ''}${esc(o.section)}</li>`; last = o.section;
    }
    html += `<li class="lb-o${o.value === r.out ? ' current' : ''}" role="option" id="opt-${i}" data-pick="${o.value}" aria-selected="${i === S.act}">${o.html}${o.k ? `<span class="k">${esc(o.k)}</span>` : ''}</li>`;
  });
  return html;
}
function outcomeA(r) {
  const edit = surface() === 'edit' && !r.done, open = S.open === r.id;
  const shown = r.out ?? (edit ? r.sugg : null);
  const text = edit && r.pairs ? 'Pick the other side' : edit && !r.sugg ? 'Choose an outcome' : null;
  const cls = surface() === 'read' ? 'chip quiet' : edit && r.sugg ? 'chip suggested' : 'chip';
  const chip = `<button type="button" class="${cls}${S.busy === r.id ? ' busy' : ''}" data-ctl="${r.id}" data-open="${r.id}" aria-haspopup="listbox" aria-expanded="${open}"
      aria-label="Outcome: ${esc(text ?? plain(shown, r))}${edit && r.sugg ? ', suggested, ' + pct(r) : ''}. Change">
      ${text ? `<span class="oc-label">${dot(null)}<span class="lbl">${text}</span></span>` : label(shown, r)}${ic('down')}</button>`;
  const pop = open ? `<div class="lb-scrim" data-close></div><div class="lb"><div class="lb-title"><b>${esc(r.desc)}</b><span>${signed(r.amount)}</span></div>
      <div class="lb-search">${ic('search')}<input id="lb-input" role="combobox" aria-expanded="true" aria-controls="lb-list" aria-activedescendant="opt-${S.act}" aria-autocomplete="list"
        placeholder="Search Categories" autocomplete="off" value="${esc(S.q)}" aria-label="Search outcomes for ${esc(r.desc)}"></div>
      <ul class="lb-list" id="lb-list" role="listbox" aria-label="Outcomes">${listboxItems(r)}</ul>
      <div class="lb-foot"><span><kbd>↑↓</kbd> move</span><span><kbd>Enter</kbd> save</span><span><kbd>Esc</kbd> close</span></div></div>` : '';

    : !edit && r.source ? `<span class="cap">${SOURCE[r.source]}</span>` : '';
  return `<div class="oc"><span class="anchor">${chip}${pop}</span>${after}${feedback(r)}</div>`;

// ===================== Variant B · text + Change, chip panel =====================
const isTouch = () => S.variant === 'D' && (S.touch || matchMedia('(pointer: coarse)').matches);
// D on touch: the button is a label over a transparent native select. The OS picker fires `change` only on confirm,

function outcomeB(r) {

  if (r.pairs) return `<div class="oc">${label('transfer', r)}<span class="cap">other side unknown</span>

function panelB(r) {

// ===================== Variant C · native select + explicit Save =====================
function outcomeC(r) {
  const edit = surface() === 'edit' && !r.done, dirty = S.dirty[r.id];
  const value = dirty ?? r.out ?? (edit ? r.sugg : null) ?? '';
  const o = v => `<option value="${v}"${String(v) === String(value) ? ' selected' : ''}>${esc(plain(v, r))}</option>`;
  let opts = '';
  if (r.pairs && edit) opts += `<option value=""${value === '' ? ' selected' : ''}>Pick the other side</option><optgroup label="Transfer: the other side">${r.pairs.map(p =>
    `<option value="${p.id}"${p.id === value ? ' selected' : ''}>${esc(p.date)} · ${esc(p.account)} · ${esc(p.desc)} ${signed(p.amount)}</option>`).join('')}</optgroup>`;
  else if (value === '') opts += `<option value="" selected>Awaiting review</option>`;
  // Most used repeats outcomes listed below; a selected value matches its own Category group.
  opts += `<optgroup label="Most used">${MOST_USED.map(v => `<option value="${v}">${esc(plain(v))}</option>`).join('')}</optgroup>`;
  opts += CATS.map(c => `<optgroup label="${esc(c.name)}">${c.subs.map(o).join('')}</optgroup>`).join('');

// ===================== Render =====================
function url(extra = {}) {
  const p = new URLSearchParams({ variant: S.variant, page: S.page, ...(S.fail ? { fail: 1 } : {}), ...(S.touch ? { touch: 1 } : {}), ...(S.frame ? { frame: 1 } : {}), ...extra });
  const t = document.documentElement.dataset.theme; if (t !== 'system') p.set('theme', t);
  return `?${p}`;
}
function render(focus) {
  document.body.className = 'vB' + (S.framed ? ' framed' : '');
  if (S.frame && !S.framed) {
    const src = url({ framed: 1, frame: 0 });
    document.getElementById('app').innerHTML = `<div class="frame-wrap"><iframe title="Phone, 390 × 844" src="${src}"></iframe></div>`;
  } else {
    document.getElementById('app').innerHTML = `<a class="skip" href="#main">Skip to content</a>` + shell({ review: pageReview, transactions: pageTransactions, dashboard: pageDashboard }[S.page]());
    document.title = `${PAGES[S.page]} · Pursegraph`;
  }
  history.replaceState(null, '', url());
  renderProto();
  if (focus) document.querySelector(focus)?.focus();
}
function announce(text) {
  S.said = text; const live = document.getElementById('live');
  live.textContent = ''; setTimeout(() => { live.textContent = text; }, 30); renderProto();
}

// ===================== Saving (stubbed: 400 ms, fails while "fail saves" is on) =====================
const ctl = id => `[data-ctl="${id}"]`;
function nextOpen(id) {
  const list = rows(), i = list.findIndex(r => r.id === id);
  return [...list.slice(i + 1), ...list.slice(0, i)].find(r => !r.done)?.id;
}
function commit(id, value, { accept = false } = {}) {
  const r = findRow(id); value = value === 'transfer' || String(value).startsWith('pair') ? value : +value;
  S.open = null; S.q = ''; S.catStep = null; S.busy = id; delete S.fb[id]; render(ctl(id));
  setTimeout(() => {
    S.busy = null;
    if (S.fail) { S.fb[id] = { kind: 'err', value }; render(ctl(id)); announce(`Couldn't save ${plain(value, r)}. Nothing changed.`); return; }
    const prev = { out: r.out, source: r.source, done: r.done };
    r.out = value; r.source = String(value).startsWith('pair') ? 'pairing' : accept ? 'llm' : 'manual';
    delete S.dirty[id];
    const inQueue = S.page === 'review';
    if (inQueue) r.done = true;
    S.fb[id] = { kind: 'ok', prev, manual: r.source === 'manual' };
    // In the Review queue focus moves on to the next Transaction still waiting; elsewhere it stays on the row.
    const to = inQueue ? nextOpen(id) : id;
    render(to ? ctl(to) : '#main');
    announce(`Saved ${r.desc} as ${plain(value, r)}.${inQueue ? ` ${queueLeft()} left to review.` : ''}`);
    clearTimeout(S.fb[id].timer);
    S.fb[id].timer = setTimeout(() => { if (S.fb[id]?.kind === 'ok') { delete S.fb[id]; document.querySelector(`[data-fb="${id}"]`)?.remove(); } }, 10000);
  }, 400);
}
function undo(id) {
  const r = findRow(id), f = S.fb[id]; if (!f?.prev) return;
  Object.assign(r, f.prev); delete S.fb[id]; render(ctl(id)); announce(`Undone. ${r.desc} is back to ${plain(r.out, r)}.`);
}

// ===================== Prototype switcher (not the design) =====================
function renderProto() {

  document.getElementById('proto').innerHTML = `<button type="button" data-proto="-1" aria-label="Previous variant">‹</button>

${S.variant === 'D' ? `<button class="toggle" type="button" data-proto="touch" title="Pretend the pointer is coarse (a phone), to see the native select">${S.touch ? 'touch ✓' : 'touch'}</button>` : ''}

// ===================== Events =====================
document.addEventListener('click', e => {
  const t = e.target.closest('[data-nav],[data-open],[data-accept],[data-pick],[data-cat],[data-close],[data-undo],[data-retry],[data-save],[data-bulk],[data-proto],.fb-link,a[href="#"]');
  if (!t) { if (S.open && !e.target.closest('.lb, tr.panel')) { const id = S.open; S.open = null; render(); } return; }
  e.preventDefault();
  const d = t.dataset;
  if (d.nav) { S.page = d.nav; S.open = null; S.fb = {}; render('#main'); window.scrollTo(0, 0); return; }
  if (d.open) { const same = S.open === d.open; S.open = same ? null : d.open; S.q = ''; S.act = 0; S.catStep = null;
    render(same ? ctl(d.open) : S.variant === 'A' ? '#lb-input' : 'tr.panel button:not(.link-btn), tr.panel [data-pick]'); return; }
  if (d.close !== undefined) { const id = S.open; S.open = null; S.catStep = null; render(id ? ctl(id) : null); return; }
  if (d.cat) { S.catStep = d.cat === 'back' ? null : +d.cat; render(d.cat === 'back' ? `[data-cat="${S.catStep ?? ''}"], tr.panel [data-cat]` : 'tr.panel [data-pick]'); return; }
  if (d.pick) { commit(S.open, d.pick); return; }
  if (d.accept) { const r = findRow(d.accept); commit(r.id, r.sugg, { accept: true }); return; }
  if (d.undo) { undo(d.undo); return; }
  if (d.retry) { const f = S.fb[d.retry]; commit(d.retry, f.value); return; }
  if (d.save) { const r = findRow(d.save), v = S.dirty[r.id]; if (v != null) commit(r.id, v); else if (r.sugg) commit(r.id, r.sugg, { accept: true }); return; }
  if (d.bulk !== undefined) { ROWS.review.filter(r => !r.done && r.sugg).forEach(r => { r.out = r.sugg; r.source = 'llm'; r.done = true; }); render('#main'); announce(`Accepted the suggestions. ${queueLeft()} left to review.`); return; }
  if (d.proto) {
    const keys = Object.keys(VARIANTS);
    if (d.proto === 'frame') S.frame = !S.frame;
    else if (d.proto === 'fail') S.fail = !S.fail;
    else if (d.proto === 'touch') S.touch = !S.touch;
    else if (d.proto === 'theme') { const order = ['system', 'light', 'dark'], h = document.documentElement; h.dataset.theme = order[(order.indexOf(h.dataset.theme) + 1) % 3]; }
    else if (d.proto === 'reset') { seed(); S.fb = {}; S.dirty = {}; S.open = null; S.said = ''; }
    else { S.variant = keys[(keys.indexOf(S.variant) + +d.proto + keys.length) % keys.length]; S.open = null; S.dirty = {}; }
    render(); return;
  }
});
document.addEventListener('change', e => {
  if (e.target.dataset.native) { commit(e.target.dataset.native, e.target.value); return; }
  const id = e.target.dataset.select; if (!id) return;
  S.dirty[id] = e.target.value; render(ctl(id));
});
document.addEventListener('input', e => {
  if (e.target.id !== 'lb-input') return;
  S.q = e.target.value; S.act = 0;
  document.getElementById('lb-list').innerHTML = listboxItems(findRow(S.open));
  e.target.setAttribute('aria-activedescendant', 'opt-0');
});
document.addEventListener('keydown', e => {
  // A: the combobox moves its highlight on arrows and saves only on Enter.
  if (e.target.id === 'lb-input') {
    const r = findRow(S.open), opts = optionsFor(r);
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault(); S.act = Math.max(0, Math.min(opts.length - 1, S.act + (e.key === 'ArrowDown' ? 1 : -1)));
      document.querySelectorAll('.lb-o').forEach(o => o.setAttribute('aria-selected', o.id === `opt-${S.act}`));
      document.getElementById(`opt-${S.act}`)?.scrollIntoView({ block: 'nearest' });
      e.target.setAttribute('aria-activedescendant', `opt-${S.act}`);
    } else if (e.key === 'Enter') { e.preventDefault(); if (opts[S.act]) commit(r.id, opts[S.act].value); }
    else if (e.key === 'Escape') { e.preventDefault(); S.open = null; render(ctl(r.id)); }
    else if (e.key === 'Tab') { S.open = null; render(ctl(r.id)); }
    return;
  }
  // C: Enter on the select saves, like the Save button.
  if (e.target.dataset.select && e.key === 'Enter') { e.preventDefault(); document.querySelector(`[data-save="${e.target.dataset.select}"]`)?.click(); return; }
  if (e.key === 'Escape' && S.open) { const id = S.open; S.open = null; S.catStep = null; render(ctl(id)); return; }
  // Variant switching only while nothing in the page has focus, so keyboard testing in the rows isn't hijacked.
  if (e.target !== document.body && e.target.id !== 'main') return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') { const keys = Object.keys(VARIANTS); S.variant = keys[(keys.indexOf(S.variant) + (e.key === 'ArrowRight' ? 1 : -1) + keys.length) % keys.length]; S.open = null; S.dirty = {}; render(); }
});

if (qs.get('theme')) document.documentElement.dataset.theme = qs.get('theme');
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
render();
</script>
